# Blind room-acoustics estimator - full experiment config.
seed: 1234
fs: 16000

paths:
  sim_dir: data/sim
  source_dirs: [data/raw/LibriSpeech]   # any folders of wav/flac dry speech or music
  real_rir_dir: data/raw/mit_ir/Audio   # measured RIRs for sim-to-real evaluation
  real_rir_exclude: "(?i)outside|outdoor|street|field|campground|parking|skatepark|bridge|backyard|balcony|forest|beach|woods"
  runs_dir: runs
  reports_dir: reports
  export_dir: exported

sim:
  n_rooms: 4000
  mics_per_room: 2
  t60_range: [0.2, 2.0]   # target mid-band T60, sampled log-uniformly (s)
  distance_range: [0.3, 6.0]  # source-mic distance, sampled log-uniformly (m)
  max_rir_s: 2.0
  ism_order: 3
  n_rays: 4000
  workers: 7
  split: {train: 0.8, val: 0.1, test: 0.1}

features:
  n_fft: 512
  win: 400      # 25 ms
  hop: 160      # 10 ms
  n_mels: 64
  fmin: 50.0
  fmax: 7800.0

data:
  clip_s: 4.0           # model input length
  warmup_s: 0.5         # discard reverb build-up before the clip
  snr_db: [5, 45]
  p_noise: 0.85
  p_synth_source: 0.15  # impulsive / harmonic synthetic sources mixed with real speech
  source_split: {train: 0.8, val: 0.1, test: 0.1}   # by speaker
  train_samples_per_epoch: 6000
  val_samples: 800
  test_samples: 1600

train:
  model: crnn
  epochs: 25
  batch_size: 32
  lr: 0.002
  weight_decay: 0.0001
  grad_clip: 5.0
  num_workers: 6
  device: auto          # auto | cpu | mps | cuda
  teacher: null         # path to a teacher checkpoint enables knowledge distillation
  distill_alpha: 0.5    # weight on ground-truth vs. teacher targets
  target_weights: [1, 1, 1, 1, 1, 1, 1, 1, 0.5]

models:
  crnn: {channels: [32, 64, 128, 128], gru: 128, dropout: 0.2}
  tcn:  {stem: [8, 16], width: 64, dilations: [1, 2, 4, 8, 1, 2, 4, 8], kernel: 5, dropout: 0.1}

realtime:
  hop_s: 0.5
  ema: 0.8
  min_rms_dbfs: -55
  min_active_frac: 0.25

export:
  n_calib: 200   # train-split clips for int8 calibration
  n_eval: 800    # test-split clips for fp32 vs int8 comparison
